[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "samara-conditions"
version = "1.0.0"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "jsonschema>=4.0"]

[tool.setuptools.package-dir]
samara = "src/samara"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
